name: build-and-test

# One serial gate, split across runners. Every job that tests runs
# `CI=1 scripts/run-tests.sh --suite ...`, the same single-worker gate the
# constrained runner ruling requires; the split only puts the slices on
# separate machines so wall time is the longest slice, not the sum.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly source-level mutant lane; see the `mutation` job.
    - cron: "0 3 * * 1"

env:
  WASI_SDK_VERSION: "32"
  WASI_SDK_SHA256: "55fc523ebfbc98f69d1034fcfcb83d1ff5610cd9ab7eceef6cd097a30ba4ef93"
  BINARYEN_VERSION: "128"
  BINARYEN_SHA256: "4ce79586d1c4762502eebe9a1db071fa5e446ef8897f2f766eb1cce5ec6dee9e"
  WIZER_VERSION: "10.0.0"
  WIZER_SHA256: "1e9dfaa2f6c436ca7acfdbb82c166f5b8a0062068f12916a554e82c97ca8d371"
  WASI_SDK_PATH: ${{ github.workspace }}/.tools/wasi-sdk
  BINARYEN_HOME: ${{ github.workspace }}/.tools/binaryen
  BOOST_INCLUDE_DIR: ${{ github.workspace }}/.tools/boost-headers
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  # Seals both products, proves their identities and generated files, and
  # packages one Hook end to end. This is the publication-facing job.
  provider:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/toolchain

      - name: Verify generated Hook ABI and TypeScript API
        run: |
          python/hostem/.venv/bin/python \
            xahau/tools/generate_raw_hook_abi.py --check
          python3 scripts/check-api-artifacts.py
          ./scripts/project-readme-examples.py --check
          python/jshookz/src/jshookz/node_modules/.bin/tsc \
            -p python/hostem/tsconfig.xahau-integration.json

      - name: Build and seal Xahau provider products
        run: |
          python/jshookz/.venv/bin/jshookz build provider
          scripts/provider-identity.py check
          scripts/provider-identity.py self-test
          python/jshookz/.venv/bin/jshookz build provider-consensus-entropy

      - name: Check generated definitions
        run: scripts/check-generated-definitions.sh

      - name: Check the exported consumer bundle and the sealed stack
        run: |
          test -s build/xahau-provider-bundle/jshookz_provider.lock.json
          test -s build/xahau-provider-consensus-entropy-bundle/jshookz_provider.lock.json
          CI=1 scripts/run-tests.sh --suite wasm-stack

      - name: End-to-end compile and package a hook
        run: |
          cd "$RUNNER_TEMP"
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$GITHUB_WORKSPACE/python/jshookz/.venv/bin/jshookz" info
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$GITHUB_WORKSPACE/python/jshookz/.venv/bin/jshookz" compile-hook \
            "$GITHUB_WORKSPACE/python/hostem/examples/xahau-accept.hook.ts" \
            -o smoke.qjsc
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$GITHUB_WORKSPACE/python/jshookz/.venv/bin/jshookz" package-hook \
            "$GITHUB_WORKSPACE/python/hostem/examples/xahau-accept.hook.ts" \
            --profile "$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.manifest.json" \
            -o smoke.xqjs
          test -s smoke.qjsc
          test -s smoke.xqjs

  # Docker-isolated Linux poison probes; independent of every other job.
  poison:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preflight provider-static poison probes on Linux
        run: ./scripts/run-linux-product-gate.sh poison

  jshookz:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
      - name: Build and seal Xahau provider products
        run: |
          python/jshookz/.venv/bin/jshookz build provider
          python/jshookz/.venv/bin/jshookz build provider-consensus-entropy
      - name: Test jshookz and x-data
        run: CI=1 scripts/run-tests.sh --suite jshookz --suite x-data

  hostem:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
      - name: Build and seal Xahau provider products
        run: |
          python/jshookz/.venv/bin/jshookz build provider
          python/jshookz/.venv/bin/jshookz build provider-consensus-entropy
      - name: Test hostem
        run: CI=1 scripts/run-tests.sh --suite hostem

  native:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
      - name: Build host C++
        run: |
          conan profile detect --exist-ok
          conan install cpp --output-folder=build/cpp --build=missing \
            -s compiler.cppstd=23
          cmake -S cpp -B build/cpp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build/cpp/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp
      - name: Test host C++
        run: CI=1 scripts/run-tests.sh --suite ctest

  quickjs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test vendored QuickJS
        working-directory: cpp/quickjs
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" CONFIG_WERROR=y
          make test

  # Source-level provider mutants rebuild and reseal the provider once per
  # mutant. They prove the oracle rows still discriminate, which changes only
  # when the kernel or the oracle changes, so they run weekly and on demand
  # rather than on every push.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/toolchain

      - name: Build and seal the baseline provider
        run: python/jshookz/.venv/bin/jshookz build provider

      - name: Kill source-level provider mutants
        # Each mutant rebuilds the provider inside test setup, which sits near
        # the suite's 60s per-test timeout on a two-core runner.
        run: |
          python/jshookz/.venv/bin/pytest -q -m mutation --timeout 300 \
            -o cache_dir=build/pytest-cache/mutation python/jshookz/tests
