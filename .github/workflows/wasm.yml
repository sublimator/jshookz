name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run the shared pinned Linux product gate
        run: ./scripts/run-linux-product-gate.sh full

  quickjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test vendored QuickJS
        working-directory: cpp/quickjs
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" CONFIG_WERROR=y
          make test
