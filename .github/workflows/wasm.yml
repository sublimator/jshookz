name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WASI_SDK_VERSION: "32"
  WASI_SDK_SHA256: "55fc523ebfbc98f69d1034fcfcb83d1ff5610cd9ab7eceef6cd097a30ba4ef93"
  WASMTIME_VERSION: "47.0.3"
  WASMTIME_SHA256: "aaa3621f2a3d8393696702897f8f78a1cc504437d500701496d560125aefd732"
  BINARYEN_VERSION: "128"
  BINARYEN_SHA256: "4ce79586d1c4762502eebe9a1db071fa5e446ef8897f2f766eb1cce5ec6dee9e"
  WASI_SDK_PATH: ${{ github.workspace }}/.tools/wasi-sdk
  WASMTIME_HOME: ${{ github.workspace }}/.tools/wasmtime
  BINARYEN_HOME: ${{ github.workspace }}/.tools/binaryen
  BOOST_INCLUDE_DIR: ${{ github.workspace }}/.tools/boost-headers
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codec/xrpl/differential/package-lock.json

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl libboost-dev libssl-dev ninja-build xz-utils
          mkdir -p "$BOOST_INCLUDE_DIR"
          ln -s /usr/include/boost "$BOOST_INCLUDE_DIR/boost"
          npm install --global typescript@6.0.3

      - name: Install wasi-sdk
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          echo "$WASI_SDK_SHA256  /tmp/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasi-sdk.tar.gz -C .tools
          mv ".tools/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" "$WASI_SDK_PATH"

      - name: Install Wasmtime C API
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output /tmp/wasmtime-c-api.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux-c-api.tar.xz"
          echo "$WASMTIME_SHA256  /tmp/wasmtime-c-api.tar.xz" | sha256sum --check
          tar -xJf /tmp/wasmtime-c-api.tar.xz -C .tools
          mv ".tools/wasmtime-v${WASMTIME_VERSION}-x86_64-linux-c-api" "$WASMTIME_HOME"

      - name: Install Binaryen
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  /tmp/binaryen.tar.gz" | sha256sum --check
          tar -xzf /tmp/binaryen.tar.gz -C .tools
          mv ".tools/binaryen-version_${BINARYEN_VERSION}" "$BINARYEN_HOME"
          echo "$BINARYEN_HOME/bin" >> "$GITHUB_PATH"

      - name: Install locked test environments
        run: |
          uv sync --project packages/jshookz --locked --group dev
          uv sync --project packages/hostem --locked --group dev
          uv sync --project codec/xrpl --locked
          npm ci --prefix codec/xrpl/differential --ignore-scripts
          npm audit --prefix codec/xrpl/differential --audit-level=high

      - name: Verify generated Hook ABI and TypeScript API
        run: |
          packages/hostem/.venv/bin/python \
            integrations/xahau/tools/generate_raw_hook_abi.py --check
          python3 scripts/check-api-artifacts.py
          ./scripts/project-readme-examples.py --check
          tsc -p packages/hostem/tsconfig.xahau-integration.json

      - name: Build and seal Xahau provider
        run: packages/jshookz/.venv/bin/jshookz build provider

      - name: Build codec and combined fixture
        run: |
          cmake -S codec/xrpl -B build/codec -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBOOST_INCLUDE_DIR="$BOOST_INCLUDE_DIR"
          cmake --build build/codec
          cmake -S codec/xrpl/fixture-provider -B build/codec-fixture -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBOOST_INCLUDE_DIR="$BOOST_INCLUDE_DIR"
          cmake --build build/codec-fixture
          scripts/check-generated-definitions.sh

      - name: Build codec fixture host
        run: |
          cmake -S codec/xrpl/host -B build/codec-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWASMTIME_ROOT="$WASMTIME_HOME"
          cmake --build build/codec-host

      - name: Test product surfaces
        env:
          XAHAUD_PROPERTY_MAX_EXAMPLES: "8"
        run: |
          packages/jshookz/.venv/bin/pytest -q packages/jshookz/tests
          packages/hostem/.venv/bin/pytest -q packages/hostem/tests
          codec/xrpl/.venv/bin/pytest -q codec/xrpl/tests
          scripts/check-wasm-stack.sh

      - name: Verify wheel contents
        run: |
          uv build --project packages/jshookz --wheel --out-dir build/dist
          unzip -l build/dist/jshookz-*.whl | grep 'jshookz/types/hooks-api.d.ts'
          unzip -l build/dist/jshookz-*.whl | grep 'jshookz/types/xahau-quickjs-v1.d.ts'
          unzip -l build/dist/jshookz-*.whl | grep 'jshookz/types/xahau-quickjs-v1.surface.json'
          unzip -l build/dist/jshookz-*.whl | grep 'jshookz/types/api-artifacts.json'
          unzip -l build/dist/jshookz-*.whl | grep 'jshookz/result_validator.js'
          uv venv "$RUNNER_TEMP/jshookz-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/jshookz-wheel-smoke/bin/python" \
            build/dist/jshookz-*.whl
          cd "$RUNNER_TEMP"
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$RUNNER_TEMP/jshookz-wheel-smoke/bin/jshookz" info
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$RUNNER_TEMP/jshookz-wheel-smoke/bin/jshookz" compile-hook \
            "$GITHUB_WORKSPACE/packages/hostem/examples/xahau-accept.hook.ts" \
            -o smoke.qjsc
          JSHOOKZ_PROVIDER_WASM="$GITHUB_WORKSPACE/build/xahau-provider/jshookz_provider.wasm" \
            "$RUNNER_TEMP/jshookz-wheel-smoke/bin/jshookz" package-hook \
            "$GITHUB_WORKSPACE/packages/hostem/examples/xahau-accept.hook.ts" \
            --profile "$GITHUB_WORKSPACE/integrations/xahau/profiles/xahau-quickjs-v1.lock.json" \
            -o smoke.xqjs
          test -s smoke.qjsc
          test -s smoke.xqjs

  quickjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test vendored QuickJS
        working-directory: engine/quickjs
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" CONFIG_WERROR=y
          make test
