[project]
name = "hostem"
version = "0.1.0"
description = "Compose QuickJS-in-WASM guests with hookz's Xahau host semantics"
requires-python = ">=3.12"
dependencies = [
    "jshookz",
    "hookz @ git+https://github.com/sublimator/hookz.git@299a812d9badb5baf66da9fe73e7b1f740298822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hostem"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
jshookz = { path = "../jshookz", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
